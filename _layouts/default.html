<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'fa' }}"
      dir="{{ page.dir | default: site.dir | default: 'rtl' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main">
      {% if page.lang == 'fa' %}پرش به محتوا{% else %}Skip to content{% endif %}
    </a>
    <header class="site-header wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="Main navigation" class="site-nav">
          {% if page.lang == 'fa' %}
            <a href="{{ '/' | relative_url }}">خانه</a>
            <a href="{{ '/blog/' | relative_url }}">بلاگ</a>
          {% else %}
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/blog/' | relative_url }}">Blog</a>
          {% endif %}
      </nav>
    </header>

    <main id="main" class="wrap">
      {{ content }}
    </main>

    <footer class="site-footer wrap">
      <span>© {{ site.time | date: "%Y" }} {{ site.title | escape }}</span>
      <span>
        Powered by Jekyll and GitHub Pages
      </span>
    </footer>
  </body>
</html>
