<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}"
      dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%90%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    {% seo %}
  </head>
  <body class="{% if page.layout == 'home' %}home{% elsif page.layout == 'blog' %}blog{% elsif page.layout == 'post' %}post{% else %}page{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>

    <header>
      <a class="title" href="{{ '/' | relative_url }}"><h1>{{ site.title | escape }}</h1></a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer>
      Powered by Jekyll and GitHub Pages
    </footer>
  </body>
</html>
