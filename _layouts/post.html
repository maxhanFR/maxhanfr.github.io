---
layout: default
---
<article class="article" lang="{{ page.lang | default: 'fa' }}" dir="{{ page.dir | default: 'rtl' }}">
  <header class="article-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="article-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b, %Y" }}</time>
    </p>
  </header>
  <div class="prose" dir="{{ page.dir | default: 'rtl' }}">{{ content }}</div>
  <nav class="article-end" aria-label="Back to posts">
    {% if page.dir == 'ltr' or page.lang == 'en' %}
      <a href="{{ '/blog/' | relative_url }}">← Back to blog</a>
    {% else %}
      <a href="{{ '/blog/' | relative_url }}">بازگشت به بلاگ ←</a>
    {% endif %}
  </nav>
</article>
